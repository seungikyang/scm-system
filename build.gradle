plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Flyway 라이브러리뿐 아니라 시작 시 migrate()를 호출하는 Boot 자동 설정도 포함한다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    runtimeOnly 'com.h2database:h2'
    // Boot 4에서는 H2 드라이버와 콘솔 자동 설정이 분리되어 별도 모듈이 필요하다.
    runtimeOnly 'org.springframework.boot:spring-boot-h2console'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'mysql'
    }
}

tasks.register('mysqlSchemaTest', Test) {
    group = 'verification'
    description = '실제 MySQL에서 Flyway 마이그레이션과 JPA 스키마 계약을 검증한다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mysql'
    }
    shouldRunAfter tasks.named('test')
}

// 실행 가능한 bootJar 하나만 생성 (plain jar 비활성 → Docker COPY 시 단일 jar 보장)
tasks.named('jar') {
    enabled = false
}

// 테스트와 실행 가능한 JAR를 한 번에 검증하는 포트폴리오 품질 게이트.
tasks.register('verifyRepositoryBoundary') {
    group = 'verification'
    description = '임시 영역에 프로그램 파일이 추적되지 않는지 검증한다.'

    doLast {
        File repositoryRoot = rootProject.projectDir.canonicalFile
        File invocationDirectory = new File(System.getProperty('user.dir')).canonicalFile
        if (invocationDirectory != repositoryRoot) {
            throw new GradleException("저장소 루트에서 Gradle을 실행하세요: ${repositoryRoot}")
        }

        Process process = new ProcessBuilder('git', 'ls-files')
                .directory(repositoryRoot)
                .redirectErrorStream(true)
                .start()
        String output = process.inputStream.getText('UTF-8')
        int exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("Git 추적 파일 검사 실패:\n${output}")
        }

        List<String> forbiddenPrefixes = [
                '.omc/', '.playwright-cli/', '.gradle/', 'build/', 'bin/',
                'out/', 'output/', '_workspace/', '_workspace_prev/',
                'practice/workspace/'
        ]
        List<String> violations = output.readLines().findAll { String path ->
            path == 'build-report.json' || forbiddenPrefixes.any { path.startsWith(it) }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "임시 영역의 파일은 프로그램 변경으로 추적할 수 없습니다:\n" +
                            violations.collect { " - ${it}" }.join('\n'))
        }
        println "Repository boundary OK: ${repositoryRoot}"
    }
}

tasks.register('portfolioCheck') {
    group = 'verification'
    description = '전체 자동 테스트와 실행 가능한 bootJar 생성을 검증한다.'
    dependsOn tasks.named('verifyRepositoryBoundary'), tasks.named('test'), tasks.named('bootJar')
}

// ============================================================================
// 학습 워크북 도구
// ============================================================================

def practiceStarterDir = layout.projectDirectory.dir('practice/starter')
def practiceWorkspaceDir = layout.projectDirectory.dir('practice/workspace')
def practiceNotesTemplate = layout.projectDirectory.file('practice/LEARNING_NOTES.template.md')

tasks.register('practiceInit', Copy) {
    group = 'practice'
    description = 'starter 원본을 보존한 채 개인 풀이 공간(practice/workspace)을 만든다.'
    outputs.upToDateWhen { false }
    from practiceStarterDir
    from(practiceNotesTemplate) {
        rename { 'LEARNING_NOTES.md' }
    }
    into practiceWorkspaceDir

    doFirst {
        File workspace = practiceWorkspaceDir.asFile
        if (workspace.exists() && workspace.listFiles()?.length > 0) {
            throw new GradleException(
                    'practice/workspace가 이미 존재합니다. 기존 풀이를 보존하기 위해 덮어쓰지 않습니다.')
        }
    }

    doLast {
        println '학습 공간 생성 완료: practice/workspace'
        println './gradlew practiceStatus 로 남은 빈칸을 확인하세요.'
    }
}

tasks.register('practiceStatus') {
    group = 'practice'
    description = '개인 풀이 공간의 모듈별 남은 빈칸과 체크리스트 수를 보여준다.'

    doLast {
        File root = practiceWorkspaceDir.asFile.exists()
                ? practiceWorkspaceDir.asFile
                : practiceStarterDir.asFile
        if (root == practiceStarterDir.asFile) {
            println 'practice/workspace가 없어 starter 원본의 초기 상태를 표시합니다.'
        }

        Map<String, Map<String, Integer>> summary = new TreeMap<>()
        fileTree(root).files.findAll { it.isFile() }.each { File file ->
            String relative = root.toPath().relativize(file.toPath()).toString()
            List<String> pathParts = relative.tokenize(File.separator)
            if (pathParts.size() < 2) {
                return
            }
            String module = pathParts[0]
            String content = file.getText('UTF-8')
            Map<String, Integer> counts = summary.computeIfAbsent(module) {
                [blanks: 0, checks: 0]
            }
            counts.blanks += (content =~ /____/).count
            counts.checks += (content =~ /- \[ \]/).count
        }

        println String.format('%-32s %8s %10s', 'MODULE', 'BLANKS', 'UNCHECKED')
        summary.each { module, counts ->
            println String.format('%-32s %8d %10d', module, counts.blanks, counts.checks)
        }
        int totalBlanks = summary.values().sum { it.blanks } ?: 0
        int totalChecks = summary.values().sum { it.checks } ?: 0
        println "남은 빈칸: ${totalBlanks}, 미완료 체크: ${totalChecks}"
    }
}

tasks.register('practiceCheck') {
    group = 'practice'
    description = '개인 풀이 공간에 미작성 빈칸/체크 항목이 남았는지 검사한다(정답 채점은 아님).'

    doLast {
        File root = practiceWorkspaceDir.asFile
        if (!root.exists()) {
            throw new GradleException('먼저 ./gradlew practiceInit 을 실행하세요.')
        }
        int blanks = 0
        int unchecked = 0
        fileTree(root).files.findAll { it.isFile() }.each { File file ->
            String content = file.getText('UTF-8')
            blanks += (content =~ /____/).count
            unchecked += (content =~ /- \[ \]/).count
        }
        if (blanks > 0 || unchecked > 0) {
            throw new GradleException(
                    "워크북 미완료: 빈칸 ${blanks}개, 미완료 체크 ${unchecked}개. " +
                            './gradlew practiceStatus 로 위치를 좁혀 보세요.')
        }
        println '형식상 모든 빈칸과 체크리스트를 완료했습니다.'
        println '이 검사는 정답 여부를 채점하지 않습니다. answers.md 및 설명 질문으로 검토하세요.'
    }
}
