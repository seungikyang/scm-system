<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('재고 현황 - SCM')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-header">
        <div>
            <h1>재고 현황</h1>
            <p class="muted mb-2">입고된 현재고와 안전재고 부족 품목을 확인합니다.</p>
        </div>
    </div>

    <div class="stat-grid">
        <div class="stat-card">
            <div class="label">운영 품목</div>
            <div class="value" th:text="${summary.activeItemCount}">0</div>
        </div>
        <div class="stat-card">
            <div class="label">총 현재고</div>
            <div class="value" th:text="${#numbers.formatInteger(summary.totalQuantity, 1, 'COMMA')}">0</div>
        </div>
        <div class="stat-card">
            <div class="label">안전재고 이하</div>
            <div class="value stock-warning" th:text="${summary.lowStockCount}">0</div>
            <a th:href="@{/stocks(lowOnly=true)}">부족 품목만 보기 &rarr;</a>
        </div>
    </div>

    <div class="card">
        <form th:object="${searchForm}" th:action="@{/stocks}" method="get" class="search-bar">
            <div class="form-row">
                <label for="keyword">품목 검색</label>
                <input type="text" id="keyword" th:field="*{keyword}"
                       placeholder="품목코드 또는 품목명">
            </div>
            <div class="form-row checkbox-row">
                <label for="lowOnly">
                    <input type="checkbox" id="lowOnly" th:field="*{lowOnly}">
                    안전재고 이하만 보기
                </label>
            </div>
            <div class="form-row search-actions">
                <button type="submit" class="btn btn-primary">조회</button>
                <a class="btn btn-ghost" th:href="@{/stocks}">초기화</a>
            </div>
        </form>
    </div>

    <div class="table-scroll">
        <table class="data">
            <thead>
            <tr>
                <th>품목코드</th>
                <th>품목명</th>
                <th>단위</th>
                <th class="num">현재고</th>
                <th class="num">안전재고</th>
                <th class="num">부족수량</th>
                <th>재고상태</th>
            </tr>
            </thead>
            <tbody>
            <tr class="empty-row" th:if="${stocks.isEmpty()}">
                <td colspan="7">조건에 맞는 재고가 없습니다.</td>
            </tr>
            <tr th:each="stock : ${stocks.content}">
                <td><a th:href="@{/items/{id}(id=${stock.itemId})}"
                       th:text="${stock.itemCode}">ITM-001</a></td>
                <td th:text="${stock.itemName}">품목명</td>
                <td th:text="${stock.unit}">EA</td>
                <td class="num strong" th:text="${#numbers.formatInteger(stock.quantity, 1, 'COMMA')}">0</td>
                <td class="num" th:text="${#numbers.formatInteger(stock.safetyStock, 1, 'COMMA')}">0</td>
                <td class="num" th:text="${#numbers.formatInteger(stock.shortageQuantity, 1, 'COMMA')}">0</td>
                <td><span class="badge" th:classappend="'badge-' + ${stock.level}"
                          th:text="${stock.level.label}">정상</span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:replace="~{fragments/layout :: pagination(${stocks},
            @{/stocks(keyword=${searchForm.keyword},lowOnly=${searchForm.lowOnly})} + '&page=')}"></nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
