<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  공지 등록·수정 화면입니다. 제목, 내용, 중요 여부를 입력 양식에 묶어 서버로 보냅니다.
  서버에서 입력 오류가 나면 같은 화면과 입력값을 다시 보여 줍니다.
-->
<head th:replace="~{fragments/layout :: head('SCM')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><main>
<div th:replace="~{fragments/layout :: alerts}"></div>

<h1 th:text="${noticeId != null ? '공지 수정' : '공지 등록'}"></h1>
<!-- noticeId가 있으면 그 글을 수정하고, 없으면 새 글을 등록할 주소로 보냅니다. -->
<!-- @{...}는 /scm 같은 배포 경로를 주소에 붙여, 프로그램 안의 올바른 저장 주소로 연결합니다. -->
<div class="card"><form th:object="${noticeForm}" th:action="${noticeId != null} ? @{/notices/{id}(id=${noticeId})} : @{/notices}" method="post">
<div class="alert alert-error" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
<div class="form-row"><label for="title">제목</label><input type="text" id="title" th:field="*{title}" required maxlength="200"></div>
<div class="form-row"><label for="content">내용</label><textarea id="content" th:field="*{content}" required maxlength="10000" rows="12"></textarea></div>
<div class="form-row"><label><input type="checkbox" th:field="*{important}"> 중요 공지</label></div>
<div class="form-actions"><button class="btn btn-primary" type="submit">저장</button><a class="btn btn-ghost" th:href="@{/notices}">목록</a></div>
</form></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
